services:
  central:
    build:
      context: ../..
      dockerfile: Dockerfile.v182
    container_name: central-eleitoral
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8787"
    expose:
      - "8787"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    container_name: central-caddy
    restart: unless-stopped
    depends_on:
      central:
        condition: service_healthy
    environment:
      CENTRAL_HOST: ${CENTRAL_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
